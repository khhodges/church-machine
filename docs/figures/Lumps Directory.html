<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lumps Directory</title>
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; margin: 0; background: #f2f3f7; color: #1a1a1a; font-size: 0.88rem; }

/* ── Two-column layout ── */
.layout { display: flex; height: 100vh; overflow: hidden; }
.left-col { width: 420px; flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #d0d4de; }
.right-col { flex: 1; overflow-y: auto; background: #f2f3f7; }

/* ── Left: header ── */
.left-header { padding: 0.75rem 1rem 0.5rem; border-bottom: 1px solid #e0e4ee; }
.left-header h1 { margin: 0 0 0.15rem; font-size: 1.1rem; color: #1a2a4a; }
.left-header p { margin: 0; font-size: 0.78rem; color: #666; }

/* ── Left: lump list ── */
.lump-list { flex: 1; overflow-y: auto; }
.group-hdr { padding: 0.3rem 1rem; background: #1e2d52; color: #b8c8e8; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; position: sticky; top: 0; z-index: 1; }
.lump-row { display: flex; align-items: center; padding: 0.45rem 1rem; cursor: pointer; border-bottom: 1px solid #eef0f7; transition: background 0.12s; }
.lump-row:hover { background: #edf2ff; }
.lump-row.active { background: #dce8ff; border-left: 3px solid #1a5cc8; }
.lump-row.wip .lump-name { color: #888; font-style: italic; }
.lump-name { flex: 1; font-weight: 600; font-size: 0.86rem; }
.lump-gen { font-family: monospace; font-size: 0.75rem; color: #666; margin-right: 0.5rem; }
.badge { display: inline-block; font-size: 0.68rem; padding: 0.1rem 0.35rem; border-radius: 3px; font-weight: 700; }
.badge-rel   { background: #d1f5d1; color: #1a6b1a; }
.badge-wip   { background: #fff3cd; color: #7a5700; }
.badge-fault { background: #fde8e8; color: #cc0000; margin-right: 0.25rem; cursor: help; }

/* ── Right: welcome ── */
.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #888; gap: 0.75rem; }
.welcome .big { font-size: 2.5rem; }
.welcome p { font-size: 0.9rem; }

/* ── Right: review panel ── */
.review { padding: 1.25rem 1.5rem; display: none; }
.review.visible { display: block; }
.rev-filename { font-size: 0.72rem; font-family: 'Courier New', monospace; color: #7a8aaa; letter-spacing: 0.01em; margin: 0 0 0.15rem; user-select: all; }
.rev-title { font-size: 1.3rem; font-weight: 700; color: #1a2a4a; margin: 0 0 0.1rem; }
.rev-sub { font-size: 0.8rem; color: #666; margin: 0 0 0.9rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.rev-sub code { background: #e8ebf8; padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.78rem; }

/* ── Tabs ── */
.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 2px solid #c8d0e8; margin-bottom: 1rem; }
.tab { padding: 0.4rem 0.85rem; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: #555; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tab:hover { color: #1a5cc8; }
.tab.active { color: #1a5cc8; border-bottom-color: #1a5cc8; background: none; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── Cards ── */
.card { background: #fff; border: 1px solid #dde2ef; border-radius: 6px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
.card h3 { margin: 0 0 0.6rem; font-size: 0.88rem; color: #2a3a6a; border-bottom: 1px solid #eef; padding-bottom: 0.35rem; }
.kv-grid { display: grid; grid-template-columns: 140px 1fr; gap: 0.25rem 0.75rem; }
.kv-key { font-weight: 600; color: #555; font-size: 0.82rem; }
.kv-val { color: #222; font-size: 0.82rem; word-break: break-word; }
.kv-val code { font-family: monospace; background: #f0f2f8; padding: 0.05rem 0.3rem; border-radius: 2px; }
.kv-val a { color: #1a5cc8; text-decoration: none; }
.kv-val a:hover { text-decoration: underline; }

/* ── Binary decode ── */
.header-word { font-family: monospace; font-size: 1rem; background: #1e2d52; color: #b8ffb8; padding: 0.5rem 0.85rem; border-radius: 4px; display: inline-block; margin-bottom: 0.75rem; letter-spacing: 0.08em; }
.field-table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
.field-table th, .field-table td { border: 1px solid #dde; padding: 0.3rem 0.55rem; text-align: left; }
.field-table th { background: #eef0f8; font-weight: 700; }
.layout-diag { font-family: monospace; font-size: 0.78rem; background: #f5f7ff; border: 1px solid #d0d8ee; border-radius: 4px; padding: 0.7rem 1rem; white-space: pre; line-height: 1.5; overflow-x: auto; }

/* ── Spec check ── */
.check-list { list-style: none; margin: 0; padding: 0; }
.check-item { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.35rem 0; border-bottom: 1px solid #eef; font-size: 0.82rem; }
.check-item:last-child { border: none; }
.check-icon { font-size: 1rem; flex-shrink: 0; margin-top: -0.05rem; }
.check-pass .check-icon { color: #1a7a1a; }
.check-fail .check-icon { color: #cc0000; }
.check-warn .check-icon { color: #cc7700; }
.check-info .check-icon { color: #1a5cc8; }
.check-rule { font-weight: 600; min-width: 60px; color: #333; }
.check-desc { flex: 1; color: #444; }
.check-val { font-family: monospace; font-size: 0.78rem; color: #0055aa; }

/* ── Methods ── */
.method-entry { border: 1px solid #dde2ee; border-radius: 5px; margin-bottom: 0.75rem; overflow: hidden; }
.method-header { background: #eef0f8; padding: 0.45rem 0.8rem; display: flex; align-items: center; gap: 0.75rem; }
.method-name { font-weight: 700; font-size: 0.88rem; color: #1a2a5a; }
.method-offset { font-family: monospace; font-size: 0.75rem; color: #888; }
.method-len { font-size: 0.72rem; color: #aaa; }
.method-vis { font-size: 0.7rem; padding: 0.05rem 0.3rem; border-radius: 3px; background: #c8e8c8; color: #1a5a1a; font-weight: 600; }
.method-vis.private { background: #f0e8d8; color: #7a4a00; }
.method-body { padding: 0.5rem 0.8rem; font-size: 0.82rem; }
.method-desc { color: #333; margin-bottom: 0.4rem; line-height: 1.5; }
.io-section { margin-top: 0.35rem; }
.io-label { font-weight: 600; font-size: 0.78rem; color: #555; margin-bottom: 0.2rem; }
.io-list { list-style: none; margin: 0; padding: 0; }
.io-list li { font-family: monospace; font-size: 0.75rem; color: #334; padding: 0.1rem 0; border-left: 2px solid #a8b8e8; padding-left: 0.4rem; margin-bottom: 0.2rem; }
.code-snippet { font-family: monospace; font-size: 0.75rem; background: #1e2d52; color: #c8d8f8; padding: 0.5rem 0.75rem; border-radius: 4px; margin-top: 0.4rem; white-space: pre; overflow-x: auto; }

/* ── C-list ── */
.clist-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.clist-table th, .clist-table td { border: 1px solid #dde; padding: 0.35rem 0.55rem; }
.clist-table th { background: #eef0f8; }
.gt-word { font-family: monospace; font-size: 0.78rem; color: #0044aa; }
.gt-link { cursor: pointer; text-decoration: underline dotted #0044aa; }
.gt-link:hover { color: #002288; background: #eaf0ff; border-radius: 2px; }
.perm { display: inline-block; padding: 0.05rem 0.3rem; border-radius: 3px; font-size: 0.7rem; font-weight: 700; margin: 0.05rem; }
.perm-E { background: #d8f0d8; color: #1a5a1a; }
.perm-R { background: #d8e8ff; color: #1a2a7a; }
.perm-W { background: #ffe8d8; color: #7a3a00; }
.perm-L { background: #e8d8ff; color: #5a1a7a; }
.perm-S { background: #ffd8e8; color: #7a003a; }

/* ── Source ── */
.source-block { font-family: 'Courier New', Courier, monospace; font-size: 0.76rem; background: #0d1b2a; color: #c8d8f0; padding: 1rem; border-radius: 5px; white-space: pre; overflow: auto; max-height: 420px; line-height: 1.5; }
.source-absent { background: #f5f7ff; border: 1px dashed #c8d0e8; border-radius: 4px; padding: 0.85rem 1rem; color: #888; font-style: italic; font-size: 0.82rem; line-height: 1.65; }
.source-absent code { color: #1a5cc8; background: #eef0f8; padding: 0.1rem 0.3rem; border-radius: 2px; font-style: normal; font-family: monospace; }

/* ── Assembler listing ── */
.asm-ok-bar   { background: #071f07; color: #5ae05a; font-family: 'Courier New', Courier, monospace; font-size: 0.73rem; padding: 0.5rem 0.9rem; border-radius: 4px; border-left: 4px solid #2a7a2a; margin-bottom: 0.75rem; }
.asm-listing  { font-family: 'Courier New', Courier, monospace; font-size: 0.72rem; background: #0d1b2a; color: #c8d8f0; padding: 1rem 1.1rem; border-radius: 5px; overflow: auto; max-height: 480px; line-height: 1.65; white-space: pre; }

/* ── Hex dump ── */
.hex-wrap  { overflow-x: auto; overflow-y: auto; max-height: 440px; background: #fafbff; border: 1px solid #d8daee; border-radius: 4px; padding: 0.35rem 0.5rem; }
.hex-table { border-collapse: collapse; font-family: 'Courier New', Courier, monospace; font-size: 0.7rem; width: 100%; }
.hex-table tr:hover td { filter: brightness(0.92); }
.hex-addr  { color: #888; padding: 0.12rem 0.6rem 0.12rem 0; white-space: nowrap; font-weight: 600; user-select: none; }
.hex-cell  { padding: 0.1rem 0.25rem; text-align: center; white-space: nowrap; border: 1px solid #ebebf5; cursor: default; min-width: 5.8em; }
.hex-cell:hover { outline: 2px solid #1a5cc8; position: relative; z-index: 1; }
.hex-empty { color: #ccc !important; background: #f8f8fc !important; }
.hex-header    { color: #1a5a1a; background: #edfced; font-weight: 700; }
.hex-code      { color: #1a2a5a; background: #eef1ff; }
.hex-code-start{ color: #1a2a5a; background: #dce4ff; font-weight: 700; }
.hex-freespace { color: #bbb;    background: #f7f7f7; }
.hex-clist     { color: #7a4a00; background: #fff8e8; }
.hex-clist-live{ color: #6a3800; background: #ffe8b0; font-weight: 700; }
.hex-region    { padding: 0.1rem 0 0.1rem 0.55rem; font-size: 0.62rem; font-weight: 700; white-space: nowrap; user-select: none; color: #bbb; }
.hex-region-header    { color: #2a7a2a; }
.hex-region-code      { color: #3a4a9a; }
.hex-region-freespace { color: #aaa; }
.hex-region-clist     { color: #8a5a10; }
.hex-legend { display: flex; gap: 0.9rem; flex-wrap: wrap; margin-bottom: 0.55rem; font-size: 0.72rem; }
.hex-leg-item { display: flex; align-items: center; gap: 0.3rem; }
.hex-leg-swatch { width: 1em; height: 1em; border: 1px solid #ccc; border-radius: 2px; }
.disasm-btn { background: #1e2d52; color: #a8c8f8; border: 1px solid #3a5a8a; border-radius: 4px; padding: 0.32rem 0.8rem; font-size: 0.77rem; cursor: pointer; font-weight: 600; }
.disasm-btn:hover { background: #2a3d6a; }
.disasm-listing { font-family: 'Courier New', Courier, monospace; font-size: 0.7rem; background: #0d1b2a; color: #c8d8f0; padding: 0.9rem 1rem; border-radius: 5px; overflow: auto; max-height: 560px; line-height: 1.6; margin-top: 0.75rem; display: none; }
.disasm-listing.visible { display: block; }
.da-row   { display: flex; align-items: center; gap: 0.5rem; min-height: 20px; padding: 0 0.1rem; }
.da-row:hover { background: #1a2a40; }
.da-addr  { color: #5a7a9a; min-width: 5.2em; flex-shrink: 0; font-size: 0.65rem; }
.da-hex   { color: #4a6a5a; min-width: 6.6em; flex-shrink: 0; font-size: 0.65rem; }
.da-brsvg { display: inline-flex; align-items: center; flex-shrink: 0; }
.da-mnem  { min-width: 22em; flex-shrink: 0; }
.da-cmt   { color: #5a8a6a; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.da-op    { color: #a8d8f8; font-weight: 700; }
.da-cond  { color: #f7b731; font-size: 0.65rem; vertical-align: super; }
.da-lbl   { color: #f7b731; font-weight: 700; }
.da-ops   { color: #c8d8f0; }
.da-hdr   { color: #3a5a7a; white-space: pre; }
.da-sep   { color: #2a3a5a; white-space: pre; margin-top: 0.5rem; }
.da-method-hdr { color: #a8c8f8; font-weight: 700; margin-top: 0.6rem; padding: 0.2rem 0; }
.da-docstring  { color: #5a8a6a; font-style: italic; padding-left: 1rem; }
.da-label { color: #f7b731; padding: 0.1rem 0; }
.br-svg   { display: block; overflow: visible; }

/* ── Docs ── */
.doc-stat { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
.doc-count-big { font-size: 2rem; font-weight: 700; color: #1a5cc8; }
.doc-count-label { font-size: 0.8rem; color: #666; }
.doc-list { list-style: none; margin: 0; padding: 0; }
.doc-list li { padding: 0.35rem 0; border-bottom: 1px solid #eef; font-size: 0.82rem; color: #444; display: flex; gap: 0.4rem; align-items: center; }
.doc-list li:last-child { border: none; }
.doc-icon { color: #888; font-size: 0.8rem; }
.doc-link { color: #1a5cc8; text-decoration: none; }
.doc-link:hover { text-decoration: underline; }

/* ── NS state ── */
.ns-state-live { color: #1a7a1a; font-weight: 600; }
.ns-state-lazy { color: #cc7700; font-weight: 600; }
.ns-state-dynamic { color: #555; font-style: italic; }
.ns-state-null { color: #999; font-style: italic; }

.empty-note { color: #999; font-style: italic; font-size: 0.82rem; padding: 0.5rem 0; }
</style>
</head>

// ══════════════════════════════════════════════════════════════
//  SPEC COMPLIANCE CHECKS
// ══════════════════════════════════════════════════════════════
function computeHeader(lump) {
  const n = Math.log2(lump.lump_size);
  const nMinus6 = n - 6;
  const typ = lump.typ || 0;
  const header = (0x1F << 27) | (nMinus6 << 23) | (lump.cw << 10) | (typ << 8) | lump.cc;
  return { n, nMinus6, header };
}

function specChecks(lump) {
  const { n, nMinus6, header } = computeHeader(lump);
  const freespace = lump.lump_size - 1 - lump.cw - lump.cc;
  const checks = [];

  // R1: magic
  checks.push({ rule:"R1", icon:"✅", cls:"check-pass",
    desc:"Header word bits [31:27] = 0x1F (opcode trap magic)", val:`= 0x${header.toString(16).toUpperCase().padStart(8,'0').slice(0,2)}… ✓` });

  // R2: size power of 2
  const isP2 = lump.lump_size > 0 && (lump.lump_size & (lump.lump_size-1)) === 0;
  checks.push({ rule:"R2", icon: isP2?"✅":"❌", cls: isP2?"check-pass":"check-fail",
    desc:`lumpSize = 2^${n} = ${lump.lump_size} words (must be power of 2, 64–32768)`,
    val: isP2 ? `= 2^${n} ✓` : "NOT a power of 2 ✗" });

  // R3: n-6 ≤ 9
  const nOk = nMinus6 >= 0 && nMinus6 <= 9;
  checks.push({ rule:"R3", icon: nOk?"✅":"❌", cls: nOk?"check-pass":"check-fail",
    desc:`n-6 = ${nMinus6} ≤ 9 (max lumpSize = 2^15 = 32768 words)`,
    val: nOk ? `${nMinus6} ≤ 9 ✓` : `${nMinus6} > 9 ✗ Mint rejects` });

  // R4: cw ≤ lumpSize - cc - 2
  const cwOk = lump.cw <= lump.lump_size - lump.cc - 2;
  checks.push({ rule:"R4", icon: cwOk?"✅":"❌", cls: cwOk?"check-pass":"check-fail",
    desc:`cw (${lump.cw}) ≤ lumpSize − cc − 2 = ${lump.lump_size} − ${lump.cc} − 2 = ${lump.lump_size-lump.cc-2}`,
    val: cwOk ? "self-consistent ✓" : "header self-contradictory ✗" });

  // R5: freespace ≥ 0
  const fsOk = freespace >= 0;
  checks.push({ rule:"R5", icon: fsOk?"✅":"❌", cls: fsOk?"check-pass":"check-fail",
    desc:`freespace = lumpSize − 1 − cw − cc = ${lump.lump_size} − 1 − ${lump.cw} − ${lump.cc} = ${freespace} words (must be ≥ 0 and all-zero)`,
    val: fsOk ? `${freespace} zeros ✓` : `NEGATIVE ✗` });

  // R6: cc ≤ lumpSize - 2
  const ccOk = lump.cc <= lump.lump_size - 2;
  checks.push({ rule:"R6", icon: ccOk?"✅":"❌", cls: ccOk?"check-pass":"check-fail",
    desc:`cc (${lump.cc}) ≤ lumpSize − 2 = ${lump.lump_size-2} (c-list must fit inside lump)`,
    val: ccOk ? "c-list fits ✓" : "c-list overflows ✗" });

  // R7: NS category
  let cat, catCls, catIcon;
  if (lump.ns_slot !== null && lump.ns_slot !== undefined && lump.boot_resident) {
    cat = "Resident — NS slot is part of the boot image; Live at cold boot"; catCls="check-pass"; catIcon="✅";
  } else if (lump.ns_slot !== null && lump.ns_slot !== undefined && !lump.boot_resident) {
    cat = "Lazy-load — NS slot reserved but lump fetched on first demand"; catCls="check-warn"; catIcon="⚡";
  } else if (lump.ns_slot === null && (lump.ns_slot_policy === "dynamic" || !lump.ns_slot_policy)) {
    cat = "Dynamic — no assigned slot; Mint allocates next free slot at first use" +
          (!lump.ns_slot_policy ? " (ns_slot_policy absent, implicitly dynamic)" : "");
    catCls="check-info"; catIcon="ℹ️";
  } else if (lump.ns_slot === null && lump.ns_slot_policy === "static") {
    cat = "NULL — never enters the NS table; fetched directly by token"; catCls="check-info"; catIcon="○";
  } else {
    cat = `ns_slot=${lump.ns_slot}, policy=${lump.ns_slot_policy||'absent'}`; catCls="check-info"; catIcon="ℹ️";
  }
  checks.push({ rule:"R7", icon:catIcon, cls:catCls,
    desc:`NS category (Spec §NS Slot Assignment): ${cat}`,
    val: lump.ns_slot !== null && lump.ns_slot !== undefined ? `NS[${lump.ns_slot}]` : "no fixed slot" });

  // R8: variant group
  if (lump.variant_group) {
    checks.push({ rule:"R8", icon:"⚠️", cls:"check-warn",
      desc:`variant_group = "${lump.variant_group}" — shares NS slot ${lump.ns_slot} with another variant; exactly one active per boot image (Spec §Variant Group)`,
      val:`slot ${lump.ns_slot} shared` });
  }

  // R9: ns_slot=null without explicit policy — retired (informational warning only)
  if (lump.ns_slot === null && !lump.ns_slot_policy) {
    checks.push({ rule:"R9", icon:"⚠️", cls:"check-warn",
      desc:`R9 (retired) — ns_slot_policy is optional; null slot is implicitly dynamic`,
      val:"R9 (retired)" });
  }

  return { freespace, header, n, nMinus6, checks };
}

const GROUP_ORDER = ["Boot ROM","System","Networking","Math / Science","Data / String","Hardware","Security Test","Research Demo","IDE Namespace","Two-Enemies Proof"];

function renderList() {
  const list = document.getElementById('lumpList');
  let html = '';
  let prevGroup = null;
  GROUP_ORDER.forEach(group => {
    const groupLumps = LUMPS.filter(l => l.group === group);
    if (!groupLumps.length) return;
    html += `<div class="group-hdr">${group}</div>`;
    groupLumps.forEach(lump => {
      const { checks } = specChecks(lump);
      const rowFails = checks.filter(c => c.cls === 'check-fail');
      const faultBadge = rowFails.length
        ? `<span class="badge badge-fault" title="${rowFails.map(c=>c.rule+': '+c.desc).join('\n')}">❌ ${rowFails.length}</span>`
        : '';
      html += `<div class="lump-row${lump.status==='wip'?' wip':''}" onclick="selectLump('${lump.id}')" id="row-${lump.id}">
        <span class="lump-name">${lump.id}</span>
        <span class="lump-gen">${lump.genotype}</span>
        ${faultBadge}
        <span class="badge ${lump.status==='released'?'badge-rel':'badge-wip'}">${lump.status}</span>
      </div>`;
    });
  });
  list.innerHTML = html;
}

//  SELECT LUMP
// ══════════════════════════════════════════════════════════════
let currentTab = 'overview';

function selectLump(id) {
  document.querySelectorAll('.lump-row').forEach(r => r.classList.remove('active'));
  const row = document.getElementById('row-' + id);
  if (row) row.classList.add('active');

  const lump = LUMPS.find(l => l.id === id);
  if (!lump) return;

  document.getElementById('welcome').style.display = 'none';
  const review = document.getElementById('review');
  review.classList.add('visible');

  const _genoHex = (lump.genotype || '').replace(/^0x/i, '').toLowerCase();
  const _issueN  = lump.lump_version || parseInt(lump.version) || 1;
  const _fnEl    = document.getElementById('revFilename');
  if (_fnEl) _fnEl.textContent = _genoHex ? `${lump.id}.${_issueN}.${_genoHex}.lump` : '';
  document.getElementById('revTitle').textContent = lump.id;

  const { freespace, header, n, nMinus6, checks } = specChecks(lump);
  const passCount = checks.filter(c=>c.cls==='check-pass').length;
  const failCount = checks.filter(c=>c.cls==='check-fail').length;

  document.getElementById('revSub').innerHTML =
    `<span class="badge ${lump.status==='released'?'badge-rel':'badge-wip'}">${lump.status}</span>` +
    `<code>${lump.language}</code>` +
    (lump.version ? `<span>v${lump.version}</span>` : '') +
    (lump.author  ? `<span>· ${lump.author}</span>` : '') +
    `&nbsp;· Spec v1.2: <strong style="color:${failCount?'#cc0000':'#1a7a1a'}">${passCount}/${checks.length} checks</strong>`;

  const tabs = [
    { id:'overview',  label:'📋 Overview' },
    { id:'binary',    label:'🔢 Binary' },
    { id:'hex',       label:'💾 Hex' },
    { id:'spec',      label:`${failCount?'❌':'✅'} Spec v1.2` },
    { id:'methods',   label:`⚙️ Methods (${lump.methods.length})` },
    { id:'clist',     label:`🔑 C-list (${lump.capabilities.length})` },
    { id:'source',    label:'📄 Source' },
    { id:'assembler', label:'🔧 Assembler' },
    { id:'docs',      label:`📚 Docs (${lump.doc_count})` }
  ];

  document.getElementById('revTabs').innerHTML = tabs.map(t =>
    `<div class="tab${t.id===currentTab?' active':''}" onclick="switchTab('${lump.id}','${t.id}')">${t.label}</div>`
  ).join('');

  renderTabContent(lump, currentTab, { freespace, header, n, nMinus6, checks });
}

function switchTab(lumpId, tabId) {
  currentTab = tabId;
  selectLump(lumpId);
}

// ── Formal filename: dot.name.issue_n.genotype_lower.lump ─────
function formalFilename(lump) {
  const g = (lump.genotype || '').replace(/^0x/i, '').toLowerCase();
  const v = lump.lump_version || parseInt(lump.version) || 1;
  return g ? `${lump.id}.${v}.${g}.lump` : lump.id;
}

    for (const m of lump.methods) methodStarts[1 + (m.offset || 0)] = m.name;
    for (let w = 1; w <= lump.cw; w++) {
      sections[w] = methodStarts[w] ? 'code-start' : 'code';
      annots[w]   = methodStarts[w] ? `.method ${methodStarts[w]}  (W${String(w).padStart(4,'0')})` : `code word  W${String(w).padStart(4,'0')}`;
    }

    // Freespace (words cw+1 .. lump_size-cc-1)
    const fsS = lump.cw + 1, fsE = lump.lump_size - lump.cc - 1;
    for (let w = fsS; w <= fsE; w++) {
      words[w]    = 0;
      sections[w] = 'freespace';
      annots[w]   = `freespace  W${String(w).padStart(4,'0')}  (Mint verifies = 0x00000000)`;

    // C-list (words lump_size-cc .. lump_size-1)
    const clBase = lump.lump_size - lump.cc;
    for (let i = 0; i < lump.cc; i++) {
      const w   = clBase + i;
      const cap = lump.capabilities[i] || null;
      const capName  = cap ? cap.name : `slot ${i}`;
      const capPerms = cap ? ((cap.rights||[]).join('+') || '—') : '—';
      if (cap && cap.gt) {
        const gt32 = parseInt(cap.gt, 16) >>> 0;

        const gtSlot = gt32 & 0xFFFF;
        const gtVer  = (gt32 >>> 16) & 0x1FF;
        const gtTypName = ['NULL','Inform','Outform','Abstract'][gtTyp];

        if ((gt32>>>30)&1) gtPerms.push('E');
        if ((gt32>>>29)&1) gtPerms.push('S');

          + `\ntyp=${gtTyp} (${gtTypName})  perms=${gtPerms.join('')||'none'}  ns_slot=${gtSlot}  ver=${gtVer}`

    }

    const COLS = 8;
    let hexRows = '';
    let prevSec = null;

      const firstSec = sections[rStart] || 'code';

      const regionLabel = firstSec.startsWith('freespace') ? '.freespace'
                        : firstSec.startsWith('header')    ? '.header'
                        : firstSec.startsWith('clist')     ? '.clist'
                        : '.code';
      let cells = '';
      for (let c = 0; c < COLS; c++) {
        const wi = rStart + c;
        if (wi >= lump.lump_size) { cells += '<td class="hex-cell hex-empty">——————</td>'; continue; }
        const sec = sections[wi];
        const val = words[wi];
        const cls = 'hex-cell hex-' + sec.replace('-','-');
        const hexStr = val !== null ? val.toString(16).toUpperCase().padStart(8,'0') : '· · · ·';
        const tipVal = val !== null ? `0x${val.toString(16).toUpperCase().padStart(8,'0')}` : '(loading…)';
        const tip = (annots[wi] ? annots[wi] + '  |  ' : '') + tipVal;
        cells += `<td id="hexW${wi}" class="${cls}" title="${tip.replace(/"/g,'&quot;')}">${hexStr}</td>`;
      }
      const showRegion = (firstSec !== prevSec);
      prevSec = firstSec;
      hexRows += `<tr><td class="hex-addr">W${String(rStart).padStart(4,'0')}</td>${cells}<td class="${regionCls}">${showRegion ? regionLabel : ''}</td></tr>`;
    }

    // ── Build disassembly listing text ────────────────────────────────────────
    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const hxHdr = '0x' + (header>>>0).toString(16).toUpperCase().padStart(8,'0');
    let da = '';
    da += `; ${'═'.repeat(66)}\n`;
    da += `; ${formalFilename(lump)}  —  structural disassembly\n`;
    da += `; lump_size=${lump.lump_size}  cw=${lump.cw}  cc=${lump.cc}  freespace=${freespace}  typ=${lump.typ||0}\n`;
    da += `; ${'═'.repeat(66)}\n\n`;

    // Header
    da += `; ${'─'.repeat(24)} .header ${'─'.repeat(33)}\n`;
    da += `W0000   ${hxHdr}    .header\n`;
    da += `        bits[31:27]  magic   = 0x1F  (0b11111)  trap sentinel — never executed as code\n`;
    da += `        bits[26:23]  n-6     = ${String(nMinus6).padEnd(3)}   lump_size = 2^${n} = ${lump.lump_size} word${lump.lump_size!==1?'s':''} (${lump.lump_size*4} bytes)\n`;
    da += `        bits[22:10]  cw      = ${String(lump.cw).padEnd(3)}   code section: W0001..W${String(lump.cw).padStart(4,'0')}\n`;
    da += `        bits[9:8]    typ     = ${String(lump.typ||0).padEnd(3)}   ${['Function abstraction','Data abstraction','C-list only','Outform'][lump.typ||0]}\n`;
    da += `        bits[7:0]    cc      = ${String(lump.cc).padEnd(3)}   c-list: ${lump.cc>0?`W${String(lump.lump_size-lump.cc).padStart(4,'0')}..W${String(lump.lump_size-1).padStart(4,'0')}`:'none (cc=0)'}\n\n`;

    // Code section
    da += `; ${'─'.repeat(24)} .code  [${lump.cw} word${lump.cw!==1?'s':''}] ${'─'.repeat(28)}\n`;
    if (lump.cw === 0) {
      da += `; (no code — cw=0)\n\n`;
    } else if (lump.methods.length === 0) {
      da += `W0001   (loading binary…)    (${lump.cw} code words — no method table available)\n\n`;
    } else {
      let mPrev = 0;
      lump.methods.forEach((m, mi) => {
        const wS = 1 + (m.offset || 0);
        const wE = wS + (m.length || 1) - 1;
        const vis = m.visibility === 'private' ? ' [private]' : '';
        da += `\nW${String(wS).padStart(4,'0')}   .method ${m.name}${vis}  (selector ${mi+1})\n`;
        da += `        words   W${String(wS).padStart(4,'0')}..W${String(wE).padStart(4,'0')}  length=${m.length||1}\n`;
        if (m.description) da += `        desc    ${m.description.slice(0,90)}${m.description.length>90?'…':''}\n`;
        if (m.inputs && m.inputs.length)  da += `        in      ${m.inputs.join('  |  ')}\n`;
        if (m.outputs && m.outputs.length) da += `        out     ${m.outputs.join('  |  ')}\n`;
        for (let wi = wS; wi <= wE; wi++) {
          da += `        W${String(wi).padStart(4,'0')}  (loading binary…)\n`;
        }
        mPrev = wE;
      });
      da += `\n`;
    }

    // Freespace
    da += `; ${'─'.repeat(24)} .freespace  [${freespace} word${freespace!==1?'s':''}] ${'─'.repeat(25)}\n`;
    if (freespace === 0) {
      da += `; (no freespace — lump fully utilised)\n\n`;
    } else {
      da += `W${String(fsS).padStart(4,'0')}   00000000    × ${freespace}  (all-zero, verified by Mint.Lump step 7)\n`;
      da += `W${String(fsE).padStart(4,'0')}   00000000    (last freespace word)\n\n`;
    }

    // C-list
    da += `; ${'─'.repeat(24)} .clist  [cc=${lump.cc}] ${'─'.repeat(33)}\n`;
    if (lump.cc === 0) {
      da += `; cc=0 — no c-list  CR6 = NULL GT on every CALL\n`;
    } else {
      for (let i = 0; i < lump.cc; i++) {
        const w   = clBase + i;
        const cap = lump.capabilities[i] || null;
        const capName  = cap ? cap.name : `(unknown slot ${i})`;
        const capPerms = cap ? ((cap.rights||[]).join('+') || '—') : '—';
        const capGT    = (cap && cap.gt) ? cap.gt : null;
        const capNote  = cap && cap.note ? `  — ${cap.note}` : '';
        da += `\nW${String(w).padStart(4,'0')}   ${capGT ? capGT.replace('0x','').replace('0X','').toUpperCase().padStart(8,'0') : '00000000'}    c-list[${i}]  ${capName}  rights:${capPerms}${capNote}\n`;
        if (capGT) {
          const gt32 = parseInt(capGT,16) >>> 0;
          const gtTyp  = (gt32 >>> 25) & 0x3;
          const gtSlot = gt32 & 0xFFFF;
          const gtTypName = ['NULL','Inform','Outform','Abstract'][gtTyp];
          const gtPerms = [];
          if ((gt32>>>31)&1) gtPerms.push('B');
          if ((gt32>>>30)&1) gtPerms.push('E');
          if ((gt32>>>29)&1) gtPerms.push('S');
          if ((gt32>>>28)&1) gtPerms.push('L');
          if ((gt32>>>27)&1) gtPerms.push('R');
          da += `        decode  typ=${gtTyp} (${gtTypName})  perms=${gtPerms.join('')||'none'}  ns_slot=${gtSlot}  raw=${capGT}\n`;
        } else {
          da += `        decode  0x00000000 = NULL GT (runtime-issued; Mint or lazy-loader writes live GT at install time)\n`;
        }
      }
    }

    body.innerHTML = `
      <div class="card">
        <h3>Hex Dump — ${formalFilename(lump)}  (${lump.lump_size} words · ${lump.lump_size*4} bytes)</h3>
        <div class="hex-legend">
          <span class="hex-leg-item"><span class="hex-leg-swatch" style="background:#edfced;border-color:#9acea2;"></span> Header</span>
          <span class="hex-leg-item"><span class="hex-leg-swatch" style="background:#eef1ff;border-color:#9aaaca;"></span> Code</span>
          <span class="hex-leg-item"><span class="hex-leg-swatch" style="background:#dce4ff;border-color:#7a8ad8;"></span> Method start</span>
          <span class="hex-leg-item"><span class="hex-leg-swatch" style="background:#f7f7f7;border-color:#ccc;"></span> Freespace (all 0)</span>
          <span class="hex-leg-item"><span class="hex-leg-swatch" style="background:#fff8e8;border-color:#d8b870;"></span> C-list (null GT)</span>
          <span class="hex-leg-item"><span class="hex-leg-swatch" style="background:#ffe8b0;border-color:#c8900a;"></span> C-list (live GT)</span>
          <span id="_hexBinaryNote" style="color:#888;font-size:0.68rem;margin-left:auto;">⏳ Loading binary…</span>
          <span id="_hexHashCheck" style="font-size:0.68rem;margin-left:0.9rem;"></span>
        </div>
        <div id="_hexSizeWarn" style="display:none;background:#4a1a1a;color:#ffa0a0;font-size:0.72rem;padding:0.3rem 0.7rem;border-radius:3px;margin-bottom:0.4rem;"></div>
        <div id="_hexHashBanner" style="display:none;font-size:0.72rem;padding:0.3rem 0.7rem;border-radius:3px;margin-bottom:0.4rem;font-family:monospace;white-space:pre-wrap;"></div>
        <div class="hex-wrap">
          <table class="hex-table">
            <thead><tr>
              <th style="color:#888;font-size:0.65rem;padding:0.1rem 0.6rem 0.2rem 0;text-align:left;border-bottom:1px solid #dde;">Addr</th>
              ${Array.from({length:8},(_,i)=>`<th style="color:#999;font-size:0.65rem;padding:0.1rem 0.25rem 0.2rem;text-align:center;border-bottom:1px solid #dde;">+${i}</th>`).join('')}
              <th style="border-bottom:1px solid #dde;"></th>
            </tr></thead>
            <tbody>${hexRows}</tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0;">
          <button class="disasm-btn" onclick="(function(btn){var el=document.getElementById('_disasmListing');if(!el)return;var vis=el.classList.toggle('visible');btn.textContent=vis?'▲ Collapse':'🔍 Disassemble';})(this)">🔍 Disassemble</button>
          <span style="font-size:0.75rem;color:#888;">Per-word structural annotation — header fields, method boundaries, freespace scan, c-list GT decode</span>
        </div>
        <div class="disasm-listing" id="_disasmListing">${esc(da)}</div>
      </div>`;

    // ── Async: fetch binary → fill hex grid + build live disassembly ─────────
    (async function _fetchHexBinary(token, codeStart, codeEnd, methodStarts, lumpData) {

      // ── ISA tables ───────────────────────────────────────────────────────────
      const OPNAMES = {0:'LOAD',1:'SAVE',2:'CALL',3:'RETURN',4:'CHANGE',5:'SWITCH',
        6:'TPERM',7:'LAMBDA',8:'ELOADCALL',9:'XLOADLAMBDA',
        16:'DREAD',17:'DWRITE',18:'BFEXT',19:'BFINS',20:'MCMP',
        21:'IADD',22:'ISUB',23:'BRANCH',24:'SHL',25:'SHR'};
      const CONDS = ['EQ','NE','CS','CC','MI','PL','VS','VC','HI','LS','GE','LT','GT','LE','','NV'];

      // ── Mnemonic string ───────────────────────────────────────────────────────
      function _disMnem(w32, clistNames) {
        w32 = w32 >>> 0;
        const op=(w32>>>27)&0x1F, cond=(w32>>>23)&0xF, dst=(w32>>>19)&0xF;
        const src=(w32>>>15)&0xF, imm=w32&0x7FFF;
        if (op===0x1F) return '.header';
        if (op===0x1E) return `.word  0x${w32.toString(16).toUpperCase().padStart(8,'0')}`;
        const mn=OPNAMES[op]||`???[${op}]`, cs=cond===14?'':CONDS[cond];
        const R=op>=16&&op<=25?'DR':'CR';
        let ops='';
        if (op===3) ops='';
        else if (op===23){const s=(imm&0x4000)?(imm-0x8000):imm;ops=`  #${s>=0?'+':''}${s}`;}
        else if (op===2) ops=`  ${R}${dst}, ${R}${src}, method=#${imm}`;
        else if (op===8){const eSlot=imm&0x1F,eMethod=imm>>>5;ops=`  ${R}${dst}, ${R}${src}, slot=#${eSlot}, method=#${eMethod}`;}
        else if (op===0||op===1||op===7) ops=`  ${R}${dst}, ${R}${src}, slot=#${imm}`;
        else ops=`  ${R}${dst}, ${R}${src}, #${imm}`;
        let line=cs?`${mn} ${cs}${ops}`:`${mn}${ops}`;
        // Annotate LOAD/SAVE/ELOADCALL with abstraction name when src is the local c-list (CR6)
        if(src===6&&clistNames){
          let capSlot=-1;
          if(op===0) capSlot=imm;
          else if(op===1) capSlot=imm;
          else if(op===8) capSlot=imm&0x1F;
          if(capSlot>=0&&clistNames[capSlot]) line+=`  \u2192 ${clistNames[capSlot]}`;
        }
        return line;
      }

      // ── Semantic comment (ported from app-lumps.js _autoComment) ─────────────
      function _mkCmt(w32, crAlias, clistNames) {
        w32=w32>>>0; if(w32===0) return 'end of method / padding';
        const op=(w32>>>27)&0x1F, cond=(w32>>>23)&0xF, dst=(w32>>>19)&0xF;
        if(op===0x1F) return 'lump magic word — header sentinel (not executable)';
        if(op>=26)    return 'reserved opcode';
        const src=(w32>>>15)&0xF, imm=w32&0x7FFF;
        const cs=cond===14?'':('if '+CONDS[cond]+' ');
        const nm=i=>clistNames[i]||null, sl=i=>clistNames[i]||`c-list[${i}]`;
        const crN=n=>{if(crAlias[n]!==undefined){const l=nm(crAlias[n]);if(l)return `"${l}"`;}return `CR${n}`;};
        switch(op){
          case 0: return src===6?`${cs}CR${dst} ← "${sl(imm)}"` :`${cs}CR${dst} ← GT via ${crN(src)}[${imm}]`;
          case 1: return `${cs}store CR${src} → GT space of ${crN(dst)}[${imm}]`;
          case 2: return `${cs}invoke ${crN(dst)}`;
          case 3: {const m=imm&0xFFF;return m?`scrub 0b${m.toString(2).padStart(12,'0')} then return`:'return to caller';}
          case 4: return src===6?`${cs}hot-swap CR${dst} ← "${sl(imm)}"` :`${cs}update CR${dst} via ${crN(src)}[${imm}]`;
          case 5: return `${cs}SWITCH CR${src} ↔ CR${imm&0x7}`;
          case 6: {const ps=['CLEAR','R','RW','X','RX','RWX','L','S','E','LS'];return `${cs}attenuate CR${dst} → ${ps[imm&0xF]||'RSV'}${(imm>>>4)&1?'+B':''}`;}
          case 7: return `${cs}create lambda closure → CR${dst}`;
          case 8: {const r=imm&0x1F,m=imm>>>5;return `${cs}fused load+call "${sl(r)}"${m?` method #${m}`:''}→ CR${dst}`;}
          case 9: return `${cs}fused load+lambda "${sl(imm)}" → CR${dst}`;
          case 16:{const l=crAlias[src]!==undefined&&nm(crAlias[src]);return l?`${cs}DR${dst} ← "${l}"` :`${cs}DR${dst} ← data[${crN(src)}+${imm}]`;}
          case 17:{const l=crAlias[src]!==undefined&&nm(crAlias[src]);return l?`${cs}"${l}" ← DR${dst}` :`${cs}data[${crN(src)}+${imm}] ← DR${dst}`;}
          case 18:{const p=(imm>>>5)&0x1F,w=imm&0x1F;return `${cs}DR${dst}=bits[${p}:${p+w-1}] of DR${src}`;}
          case 19:{const p=(imm>>>5)&0x1F,w=imm&0x1F;return `${cs}insert ${w}b from DR${src} at pos ${p} into DR${dst}`;}
          case 20: return `${cs}compare DR${dst} vs DR${src} → flags`;
          case 21:{const r=(imm&0x4000)?`#${imm&0x3FFF}`:`DR${imm&0xF}`;return `${cs}DR${dst} = DR${src} + ${r}`;}
          case 22:{const r=(imm&0x4000)?`#${imm&0x3FFF}`:`DR${imm&0xF}`;return `${cs}DR${dst} = DR${src} − ${r}`;}
          case 23:{const s=(imm&0x4000)?(imm|0xFFFF8000):imm;return `${cs}branch → PC${s>=0?'+':''}${s}`;}
          case 24: return `${cs}DR${dst} = DR${src} << ${imm&0x1F}`;
          case 25:{const a=(imm>>>5)&1;return `${cs}DR${dst} = DR${src} >> ${imm&0x1F} (${a?'arith':'logical'})`;}
          default: return 'unknown opcode';
        }
      }

      // ── Branch arrow SVG (ported from app-cr-detail.js _computeBranchArrows) ─
      const _brColors=['#e94560','#4ecdc4','#f7b731','#a55eea','#26de81','#fd9644','#45aaf2','#fc5c65'];
      function _computeBranchArrows(words) {
        const n=words.length, branches=[];
        for(let i=0;i<n;i++){
          const w=words[i]>>>0; if(w===0)continue;
          if(((w>>>27)&0x1F)===23){
            const imm=w&0x7FFF, soff=(imm&0x4000)?(imm|0xFFFF8000):imm, tgt=i+soff;
            if(tgt>=0&&tgt<n&&tgt!==i){const top=Math.min(i,tgt),bot=Math.max(i,tgt);branches.push({src:i,tgt,top,bot,span:bot-top});}
          }
        }
        if(!branches.length) return {html:new Array(n).fill(''),hasBranches:false};
        branches.sort((a,b)=>a.span-b.span);
        for(let i=0;i<branches.length;i++){
          const b=branches[i];
          for(let lane=0;lane<8;lane++){
            let ok=true;
            for(let j=0;j<i;j++){if(branches[j].lane!==lane)continue;if(branches[j].top<=b.bot&&branches[j].bot>=b.top){ok=false;break;}}
            if(ok){b.lane=lane;break;}
          }
          if(b.lane===undefined)b.lane=0;
          b.color=_brColors[i%_brColors.length];
        }
        const maxLane=Math.max(...branches.map(b=>b.lane))+1;
        const laneW=7,tickW=5,svgW=maxLane*laneW+tickW+2,h=18,mid=h/2;
        const result=[];
        for(let row=0;row<n;row++){
          let lines='';
          for(const b of branches){
            if(row<b.top||row>b.bot)continue;
            const x=svgW-tickW-(b.lane*laneW)-2,col=b.color;
            if(row===b.top){
              lines+=`<line x1="${x}" y1="${mid}" x2="${x}" y2="${h}" stroke="${col}" stroke-width="1.5"/>`;
              lines+=`<line x1="${x}" y1="${mid}" x2="${svgW}" y2="${mid}" stroke="${col}" stroke-width="1.5"/>`;
              if(row===b.tgt)lines+=`<polygon points="${svgW},${mid} ${svgW-4},${mid-3} ${svgW-4},${mid+3}" fill="${col}"/>`;
            } else if(row===b.bot){
              lines+=`<line x1="${x}" y1="0" x2="${x}" y2="${mid}" stroke="${col}" stroke-width="1.5"/>`;
              lines+=`<line x1="${x}" y1="${mid}" x2="${svgW}" y2="${mid}" stroke="${col}" stroke-width="1.5"/>`;
              if(row===b.tgt)lines+=`<polygon points="${svgW},${mid} ${svgW-4},${mid-3} ${svgW-4},${mid+3}" fill="${col}"/>`;
            } else {
              lines+=`<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="${col}" stroke-width="1.5"/>`;
            }
          }
          result.push(lines?`<svg class="br-svg" width="${svgW}" height="${h}">${lines}</svg>`:'');
        }
        return {html:result,hasBranches:true,svgW};
      }

      const _esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

      // ── Fetch ────────────────────────────────────────────────────────────────
      const note=document.getElementById('_hexBinaryNote');
      try {
        const res=await fetch('/api/lump/'+token);
        if(!res.ok) throw new Error('HTTP '+res.status);
        const serverHashHeader=res.headers.get('X-Lump-Hash'); // sha256:<hex> of raw lump bytes
        const buf=await res.arrayBuffer();
        const view=new DataView(buf);
        const wordCount=Math.floor(buf.byteLength/4);

        // Response layout: [CRC-32 word (4 bytes)] [lump word 0] [lump word 1] … [lump word N-1]
        // lump word wi lives at response byte offset (wi+1)*4  (skip the CRC prefix).
        // wordCount includes the CRC word, so actual lump words = wordCount-1.
        const actualLumpWords=wordCount>0?wordCount-1:0;
        if(actualLumpWords!==lumpData.lump_size){
          const warn=document.getElementById('_hexSizeWarn');
          if(warn){warn.style.display='';warn.textContent=`⚠ Binary is ${actualLumpWords} words but manifest claims ${lumpData.lump_size} — file may be truncated or corrupt`;}
        }

        // Build c-list name map
        const clistNames={};
        (lumpData.capabilities||[]).forEach((cap,i)=>{if(cap&&cap.name)clistNames[i]=cap.name;});

        // Method objects map: 1-based word index → method obj
        const methodObjs={};
        (lumpData.methods||[]).forEach(m=>{methodObjs[1+(m.offset||0)]=m;});

        // ── Exact hex dump: fill every cell from the raw binary ───────────────
        // lump word wi → response offset (wi+1)*4 (first word after CRC).
        const lumpSize=lumpData.lump_size, cc=lumpData.cc, cw_=lumpData.cw;
        const clistStart=cc>0?lumpSize-cc:lumpSize;
        const codeWords=[];
        let filled=0, totalFilled=0;
        const crAlias={};

        for(let wi=0;wi<lumpSize;wi++){
          const byteOff=(wi+1)*4;
          if(byteOff+4>buf.byteLength) break;          // binary shorter than expected
          const val=view.getUint32(byteOff,false)>>>0;
          const h8=val.toString(16).toUpperCase().padStart(8,'0');

          // Fill hex grid cell
          const cell=document.getElementById('hexW'+wi);
          if(cell){ cell.textContent=h8; totalFilled++; }

          // Build per-cell tooltip
          let tip=`W${String(wi).padStart(4,'0')}  0x${h8}`;
          if(wi===0){
            tip+='\n.header  (lump magic / sentinel word)';
          } else if(wi>=1&&wi<=cw_){
            // Code region
            const mLabel=methodStarts[wi]?`.method ${methodStarts[wi]}\n`:'';
            const mn=_disMnem(val,clistNames), cmt=_mkCmt(val,crAlias,clistNames);
            tip+=`\n${mLabel}${mn}\n; ${cmt}`;
            codeWords.push(val);
            filled++;
            // Track CR aliases for semantic comments
            const op=(val>>>27)&0x1F,dst=(val>>>19)&0xF,src=(val>>>15)&0xF,imm=val&0x7FFF;
            if((op===0||op===4)&&src===6&&cc>0) crAlias[dst]=imm;
            if(op===3||val===0){for(const k of Object.keys(crAlias))delete crAlias[k];}
          } else if(wi>=clistStart&&cc>0){
            tip+=`\n.clist[${wi-clistStart}]  (c-list entry — raw binary word)`;
          } else {
            tip+='\n.freespace  (zero padding)';
          }
          if(cell) cell.title=tip;
        }
        if(note) note.textContent=totalFilled+' of '+lumpSize+' word'+(lumpSize!==1?'s':'')+' loaded \u00b7 '+filled+' code word'+(filled!==1?'s':'');

        // ── Hash crosscheck: sha256(dot_name_utf8 + lump_bytes)[:8] must equal token ─
        // The "Number" in the filename IS sha256(dot_name + binary)[:8].
        // This proves the dot.name is cryptographically bound to the binary content.
        (async()=>{
          const hashEl=document.getElementById('_hexHashCheck');
          const bannerEl=document.getElementById('_hexHashBanner');
          if(!hashEl) return;
          try {
            const rawBytes=buf.slice(4);               // strip CRC-32 prefix word
            const dotName=lumpData.dot_name||'';
            const enc=new TextEncoder();
            const dnBytes=enc.encode(dotName);

            // Two digests in parallel: binary-only and name+binary (identity)
            const combined=new Uint8Array(dnBytes.length+rawBytes.byteLength);
            combined.set(dnBytes,0);
            combined.set(new Uint8Array(rawBytes),dnBytes.length);
            const [binBuf,idBuf]=await Promise.all([
              crypto.subtle.digest('SHA-256',rawBytes),
              crypto.subtle.digest('SHA-256',combined.buffer)
            ]);
            const toHex=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
            const computedBin=toHex(binBuf);           // sha256(binary)
            const computedNum=toHex(idBuf).slice(0,8); // sha256(dot_name+binary)[:8] = Number

            // Server header: "sha256:<full-hex>"
            const srvHex=serverHashHeader?serverHashHeader.replace(/^sha256:/i,'').trim():null;
            // Manifest binary_hash (full sha256 of raw bytes, no name)
            const mfxHex=lumpData.binary_hash||null;
            // Expected Number = first 8 hex chars of the token (token IS the Number)
            const expectedNum=(token||'').toLowerCase().replace(/^0x/,'').slice(0,8);

            const binOk=(!srvHex||computedBin===srvHex)&&(!mfxHex||computedBin===mfxHex);
            const nameOk=!dotName||!expectedNum||computedNum===expectedNum;

            if(binOk&&nameOk){
              hashEl.style.color='#3a8a5a';
              hashEl.textContent=dotName
                ?`✓ sha256("${dotName}" + binary)[:8] = ${computedNum} — name bound to content`
                :`✓ Binary hash verified`;
              hashEl.title=`Computed sha256(binary): ${computedBin}\nComputed sha256("${dotName}"+binary)[:8]: ${computedNum}\nToken Number: ${expectedNum}\nX-Lump-Hash: ${srvHex||'(none)'}\nManifest binary_hash: ${mfxHex||'(none)'}`;
            } else {
              hashEl.style.cssText='color:#c84040;font-weight:600;font-size:0.68rem;';
              const parts=[];
              if(!binOk) parts.push('binary hash mismatch (file corrupt or swapped)');
              if(!nameOk) parts.push(`identity mismatch: sha256("${dotName}"+binary)[:8]=${computedNum} ≠ token ${expectedNum} — dot.name not bound to this binary`);
              hashEl.textContent=`✗ Hash FAILED`;
              if(bannerEl){
                bannerEl.style.display='';
                bannerEl.style.background='#4a1a1a';
                bannerEl.style.color='#ffa0a0';
                bannerEl.textContent=`Hash crosscheck FAILED:\n${parts.join('\n')}\n\nComputed sha256(binary):              ${computedBin}\nComputed sha256("${dotName}"+binary)[:8]: ${computedNum}\nExpected token Number:                  ${expectedNum}`;
              }
            }
          } catch(e){
            hashEl.style.color='#888';
            hashEl.textContent='(hash check unavailable)';
          }
        })();

        // ── Build live disassembly listing ────────────────────────────────────
        const listing=document.getElementById('_disasmListing');
        if(!listing||codeWords.length===0) return;

        const brArrows=_computeBranchArrows(codeWords);
        const svgW=brArrows.svgW||14;
        const emptySvg=brArrows.hasBranches?`<svg class="br-svg" width="${svgW}" height="18"></svg>`:'';

        // Branch label map
        const brTargetSet=new Set();
        codeWords.forEach((cw,ci)=>{
          if(((cw>>>27)&0x1F)!==23) return;
          const imm=cw&0x7FFF, soff=(imm&0x4000)?(imm|0xFFFF8000):imm, tgt=ci+soff;
          if(tgt>=0&&tgt<codeWords.length) brTargetSet.add(tgt);
        });
        const brLabelMap=new Map();
        Array.from(brTargetSet).sort((a,b)=>a-b).forEach((idx,n)=>brLabelMap.set(idx,`L${n}`));

        // Render  (cc, cw_, lumpSize already declared in fill loop above)
        const cw=cw_;
        let html='';
        html+=`<div class="da-hdr">; ${'═'.repeat(60)}</div>`;
        html+=`<div class="da-hdr">; ${_esc(lumpData.id||token)}  —  disassembly  (${lumpSize} words · ${lumpSize*4} bytes)</div>`;
        html+=`<div class="da-hdr">; cw=${cw}  cc=${cc}  freespace=${lumpSize-1-cw-cc}  typ=${lumpData.typ||0}</div>`;
        html+=`<div class="da-hdr">; ${'═'.repeat(60)}</div>`;

        const crA={};
        codeWords.forEach((w32,ci)=>{
          const wi=ci+1;
          const op=(w32>>>27)&0x1F, cond=(w32>>>23)&0xF;
          const dst=(w32>>>19)&0xF, src=(w32>>>15)&0xF, imm=w32&0x7FFF;
          const hex=w32.toString(16).toUpperCase().padStart(8,'0');

          // CR alias tracking for semantic comments
          if((op===0||op===4)&&src===6&&cc>0) crA[dst]=imm;
          if(op===3||w32===0){for(const k of Object.keys(crA))delete crA[k];}

          // Method boundary
          if(methodStarts[wi]){
            const mo=methodObjs[wi]||null;
            const si=(lumpData.methods||[]).findIndex(m=>(1+(m.offset||0))===wi)+1;
            html+=`<div class="da-sep">; ${'─'.repeat(60)}</div>`;
            html+=`<div class="da-method-hdr">◆ ${_esc(methodStarts[wi])}  (selector ${si||'?'})  W${String(wi).padStart(4,'0')}</div>`;
            if(mo&&mo.description) html+=`<div class="da-docstring">; ${_esc(mo.description.slice(0,100))}${mo.description.length>100?'…':''}</div>`;
            if(mo&&mo.inputs&&mo.inputs.length)  html+=`<div class="da-docstring">; in:  ${_esc(mo.inputs.join(' | '))}</div>`;
            if(mo&&mo.outputs&&mo.outputs.length) html+=`<div class="da-docstring">; out: ${_esc(mo.outputs.join(' | '))}</div>`;
          }

          // Branch target label row
          if(brLabelMap.has(ci)) html+=`<div class="da-label">${brLabelMap.get(ci)}:</div>`;

          // Mnemonic HTML with coloring
          let mnemHtml, cmt=_mkCmt(w32,crA,clistNames);
          if(op===23){
            const soff=(imm&0x4000)?(imm|0xFFFF8000):imm, tgt=ci+soff;
            const lbl=brLabelMap.get(tgt);
            if(lbl){
              const condStr=cond===14?'':CONDS[cond];
              mnemHtml=`<span class="da-op">BRANCH</span>${condStr?`<span class="da-cond"> ${condStr}</span>`:''}&#x00A0;&#x00A0;<span class="da-lbl">${lbl}</span>`;
              cmt=`branch → ${lbl}${cond!==14?' [if '+CONDS[cond]+']':''}`;
            }
          }
          if(!mnemHtml){
            const opName=OPNAMES[op]||'';
            const condStr=cond===14?'':CONDS[cond];
            const full=_esc(_disMnem(w32,clistNames));
            const pfxLen=opName.length+(condStr?condStr.length+1:0);
            mnemHtml=`<span class="da-op">${_esc(opName)}</span>`+
              (condStr?`<span class="da-cond"> ${_esc(condStr)}</span>`:'')+
              `<span class="da-ops">${full.slice(pfxLen)}</span>`;
          }

          const brSvg=brArrows.hasBranches
            ?(brArrows.html[ci]?`<span class="da-brsvg">${brArrows.html[ci]}</span>`:`<span class="da-brsvg">${emptySvg}</span>`):'';

          html+=`<div class="da-row">`+
            `<span class="da-addr">W${String(wi).padStart(4,'0')}</span>`+
            brSvg+
            `<span class="da-hex">${hex}</span>`+
            `<span class="da-mnem">${mnemHtml}</span>`+
            `<span class="da-cmt">; ${_esc(cmt)}</span>`+
            `</div>`;
        });

        listing.innerHTML=html;
        listing.dataset.loaded='1';

      } catch(e) {
        if(note) note.textContent='⚠ Binary unavailable — '+e.message;
      }
    })(lump.token, 1, lump.cw, methodStarts, lump);

  } else if (tab === 'spec') {
    body.innerHTML = `
      <div class="card">
        <h3>Compliance against CM Lump Specification v1.2 (2026-06-20)</h3>
        <ul class="check-list">
          ${checks.map(c=>`<li class="check-item ${c.cls}">
            <span class="check-icon">${c.icon}</span>
            <span class="check-rule">${c.rule}</span>
            <span class="check-desc">${c.desc}</span>
            <span class="check-val">${c.val}</span>
          </li>`).join('')}
        </ul>
      </div>
      <div class="card">
        <h3>GT Taxonomy — Spec §GT Taxonomy — Three Fundamental Classes</h3>
        <div class="kv-grid">
          <div class="kv-key">Issued GT type</div>    <div class="kv-val">E-GT (Inform, typ=01, perms: B E)</div>
          <div class="kv-key">CR14 (transient X)</div> <div class="kv-val">Derived on every CALL from NS slot — code view (X-only, words 1..${lump.lump_size-lump.cc-1})</div>
          <div class="kv-key">CR6 (transient L)</div>  <div class="kv-val">${lump.cc>0?`C-list view (L-only, words ${lump.lump_size-lump.cc}..${lump.lump_size-1})` : 'NULL GT (cc=0)'}</div>
          <div class="kv-key">Permission model</div>   <div class="kv-val">Church domain (dom=1): E=Enter, S=Save, L=Load — mutually exclusive from Turing R/W/X</div>
        </div>
      </div>
      <div class="card">
        <h3>ZIP Distribution — Spec §Zip Distribution Format</h3>
        <div class="kv-grid">
          <div class="kv-key">Distribution format</div> <div class="kv-val"><code>${lump.id}.lump.zip</code></div>
          <div class="kv-key">ZIP bit 3</div>           <div class="kv-val">Must be 0 (no data descriptor — streaming mode rejected)</div>
          <div class="kv-key">uncompressed size</div>   <div class="kv-val">${lump.lump_size * 4} bytes (${lump.lump_size} words × 4)</div>
          <div class="kv-key">Locator derives n</div>   <div class="kv-val">log₂(${lump.lump_size * 4} / 4) = ${n} → 2^${n} = ${lump.lump_size} words</div>
        </div>
      </div>`;

  } else if (tab === 'methods') {
    if (!lump.methods.length) {
      body.innerHTML = '<div class="card"><p class="empty-note">No method entries recorded for this lump. It may be a compiled binary with an undocumented internal dispatcher, or a stub with cw=0.</p></div>';
      return;
    }
    const methodsHtml = lump.methods.map(m => {
      const vis = m.visibility || 'public';
      return `<div class="method-entry">
        <div class="method-header">
          <span class="method-name">${m.name}</span>
          <span class="method-offset">offset ${m.offset}</span>
          <span class="method-len">${m.length} word${m.length!==1?'s':''}</span>
          <span class="method-vis ${vis==='private'?'private':''}">${vis}</span>
        </div>
        <div class="method-body">
          <div class="method-desc">${m.description || '—'}</div>
          ${m.inputs && m.inputs.length ? `<div class="io-section"><div class="io-label">Inputs:</div><ul class="io-list">${m.inputs.map(i=>`<li>${i}</li>`).join('')}</ul></div>` : ''}
          ${m.outputs && m.outputs.length ? `<div class="io-section"><div class="io-label">Outputs:</div><ul class="io-list">${m.outputs.map(o=>`<li>${o}</li>`).join('')}</ul></div>` : ''}
          ${m.snippet ? `<div class="code-snippet">${m.snippet}</div>` : ''}
        </div>
      </div>`;
    }).join('');
    body.innerHTML = `
      <div class="card">
        <h3>Dispatcher — Spec §C-List — Compiler-Populated</h3>
        <div class="kv-grid">
          <div class="kv-key">Entry point</div>       <div class="kv-val">PC = 1 on every CALL (Word 0 is the header, never executed)</div>
          <div class="kv-key">Dispatcher at</div>     <div class="kv-val">Word 1 — reads method selector from the CALL instruction</div>
          <div class="kv-key">Method count</div>      <div class="kv-val">${lump.methods.length} (${lump.methods.filter(m=>!m.visibility||m.visibility==='public').length} public, ${lump.methods.filter(m=>m.visibility==='private').length} private)</div>
          <div class="kv-key">Total code words</div>  <div class="kv-val">cw = ${lump.cw} (words 1..${lump.cw})</div>
        </div>
      </div>
      ${methodsHtml}`;

  } else if (tab === 'clist') {
    if (!lump.capabilities.length) {
      body.innerHTML = `<div class="card"><p class="empty-note">cc = 0 — this lump has no pre-populated c-list. All data operations use DRs directly. CR6 = NULL GT on every CALL.</p></div>`;
      return;
    }
    const rows = lump.capabilities.map(cap => {
      const permHtml = (cap.rights||[]).map(r=>`<span class="perm perm-${r}">${r}</span>`).join('');
      let gtHtml;
      if (!cap.gt) {
        gtHtml = '<span style="color:#aaa">runtime-issued</span>';
      } else {
        const nsSlot = parseInt(cap.gt, 16) & 0xFFFF;
        const target = LUMPS.find(l => l.ns_slot === nsSlot);
        gtHtml = target
          ? `<code class="gt-word gt-link" onclick="selectLump('${target.id}')" title="→ ${target.id} (NS[${nsSlot}])">${cap.gt}</code>`
          : `<code class="gt-word">${cap.gt}</code>`;
      }
      return `<tr>
        <td>${cap.slot !== undefined ? cap.slot : '—'}</td>
        <td><strong>${cap.name}</strong></td>
        <td>${permHtml || '<span style="color:#aaa">—</span>'}</td>
        <td>${gtHtml}</td>
        <td style="color:#666;font-size:0.78rem;">${cap.note||'—'}</td>
      </tr>`;
    }).join('');
    body.innerHTML = `
      <div class="card">
        <h3>C-list Layout — Spec §C-List — Compiler-Populated</h3>
        <p style="font-size:0.82rem;color:#555;margin:0 0 0.75rem;">
          The c-list occupies the last <strong>cc = ${lump.cc}</strong> words of the lump (words ${lump.lump_size-lump.cc}..${lump.lump_size-1}).
          Each slot is one 32-bit word (GT Word 0 only). Words 1–3 of the full 128-bit CR are fetched from the NS table on LOAD.
          CR6 (the transient c-list view) is derived fresh on every CALL with L-permission.
        </p>
        <table class="clist-table">
          <thead><tr><th>Slot</th><th>Name</th><th>Permissions</th><th>GT Word 0</th><th>Note</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="card">
        <h3>GT Word 0 Format — Spec §Word 0 — The Golden Token</h3>
        <div class="kv-grid">
          <div class="kv-key">Inform GT (typ=01)</div>  <div class="kv-val">References a physical memory region with specified permissions — the standard lump/device GT</div>
          <div class="kv-key">Outform GT (typ=10)</div> <div class="kv-val">IDE-managed placeholder — Absent event fires on first LOAD; Locator fetches the lump</div>
          <div class="kv-key">Abstract GT (typ=11)</div><div class="kv-val">Self-defining constant — DREAD returns a fixed value; no RAM required</div>
          <div class="kv-key">NULL GT (typ=00)</div>    <div class="kv-val">All 128 bits zero — faults on any CALL/LOAD/DREAD</div>
          <div class="kv-key">TPERM</div>               <div class="kv-val">Can only clear permission bits [31:25] — escalation is architecturally impossible; no CRC recomputation needed</div>
        </div>
      </div>`;

  } else if (tab === 'source') {
    if (!lump.source) {
      const hints = [];
      if (lump.language && lump.language !== '—') hints.push(`Language: <code>${lump.language}</code>`);
      hints.push(`Look for <code>${lump.id.toLowerCase().replace(/[^a-z0-9]+/g,'_')}.cloomc</code> or <code>${lump.id.toLowerCase().replace(/[^a-z0-9]+/g,'_')}.asm</code> in <code>simulator/examples/</code> or <code>simulator/cloomc/</code>`);
      body.innerHTML = `<div class="card">
        <h3>Source</h3>
        <div class="source-absent">
          <strong>Source not embedded for this lump.</strong><br><br>
          ${hints.join('<br>')}
        </div>
      </div>
      <div class="card">
        <h3>Identity</h3>
        <div class="kv-grid">
          <div class="kv-key">Lump</div>    <div class="kv-val">${lump.id}</div>
          <div class="kv-key">Language</div><div class="kv-val">${lump.language || '—'}</div>
          <div class="kv-key">Token</div>   <div class="kv-val"><code>${lump.token}</code></div>
          <div class="kv-key">cw</div>      <div class="kv-val">${lump.cw} code words</div>
          <div class="kv-key">Methods</div> <div class="kv-val">${lump.methods.length}</div>
        </div>
      </div>`;
      return;
    }
    body.innerHTML = `<div class="card">
      <h3>Source — ${lump.language}</h3>
      <div class="kv-grid" style="margin-bottom:0.75rem;">
        <div class="kv-key">Lump</div>      <div class="kv-val">${lump.id}</div>
        <div class="kv-key">Language</div>  <div class="kv-val">${lump.language}</div>
        <div class="kv-key">Token</div>     <div class="kv-val"><code>${lump.token}</code></div>
        <div class="kv-key">Code words</div><div class="kv-val">cw = ${lump.cw}</div>
        <div class="kv-key">Methods</div>   <div class="kv-val">${lump.methods.length}</div>
      </div>
      <div class="source-block">${lump.source.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
    </div>`;

  } else if (tab === 'assembler') {
    // Build a human-readable compilation listing from the lump metadata.
    // This mirrors what the IDE's right-hand assembler panel shows after a
    // 100% successful compile — before the user clicks SAVE LUMP.
    const hx = '0x' + header.toString(16).toUpperCase().padStart(8,'0');
    const passIcon = '✅';
    const metaLine = `; Lump: ${lump.id}  ·  Language: ${lump.language || '—'}  ·  Token: ${lump.token}`;
    const statsLine = `; cw=${lump.cw}  cc=${lump.cc}  lump_size=${lump.lump_size}  freespace=${freespace}  methods=${lump.methods.length}`;

    // Header word line
    const hdrLine = `[W${String(0).padStart(4,'0')}]  ${hx.padEnd(12)}; magic=0x1F  n-6=${nMinus6}  cw=${lump.cw}  typ=${lump.typ||0}  cc=${lump.cc}`;

    // Code section: per-method word ranges
    let codeLines = '';
    if (lump.methods.length === 0 && lump.cw > 0) {
      codeLines = `\n.code                      ; ${lump.cw} word${lump.cw!==1?'s':''} (W0001..W${String(lump.cw).padStart(4,'0')}) — no method table`;
    } else if (lump.methods.length > 0) {
      codeLines = '\n.code';
      let prevEnd = 0;
      lump.methods.forEach((m, i) => {
        const wStart = 1 + (m.offset || 0);
        const wEnd   = wStart + (m.length || 1) - 1;
        const vis    = m.visibility === 'private' ? ' (private)' : '';
        const sel    = `selector ${i + 1}`;
        codeLines += `\n  .method ${m.name.padEnd(16)}; W${String(wStart).padStart(4,'0')}..W${String(wEnd).padStart(4,'0')}  ${(m.length||1)} word${(m.length||1)!==1?'s':''}, ${sel}${vis}`;
        prevEnd = wEnd;
      });
    } else {
      codeLines = '\n; (no code — cw=0)';
    }

    // Freespace line
    const fsStart = lump.cw + 1, fsEnd = lump.lump_size - lump.cc - 1;
    const fsLine = freespace > 0
      ? `\n\n.freespace                 ; W${String(fsStart).padStart(4,'0')}..W${String(fsEnd).padStart(4,'0')}  ${freespace} zero word${freespace!==1?'s':''}  ✓ Mint verified`
      : '\n\n; (no freespace — lump fully utilised)';

    // C-list lines
    let clistLines = '';
    if (lump.cc > 0) {
      const clBase = lump.lump_size - lump.cc;
      clistLines = `\n\n.clist                     ; ${lump.cc} slot${lump.cc!==1?'s':''} (W${String(clBase).padStart(4,'0')}..W${String(lump.lump_size-1).padStart(4,'0')})`;
      if (lump.capabilities.length > 0) {
        lump.capabilities.forEach((cap, i) => {
          const perms = (cap.rights||[]).join('+') || '—';
          const w = clBase + i;
          clistLines += `\n  [slot ${i}]  ${cap.name.padEnd(16)}; W${String(w).padStart(4,'0')}  perms: ${perms}${cap.note ? '  — '+cap.note : ''}`;
        });
      } else {
        for (let i = 0; i < lump.cc; i++) {
          clistLines += `\n  [slot ${i}]  (runtime-issued)       ; W${String(clBase+i).padStart(4,'0')}`;
        }
      }
    } else {
      clistLines = '\n\n; cc=0 — no c-list';
    }

    const listing = `; ══════════════════════════════════════════════════════════════════\n${metaLine}\n${statsLine}\n; ══════════════════════════════════════════════════════════════════\n\n.header\n  ${hdrLine}${codeLines}${fsLine}${clistLines}`;

    body.innerHTML = `
      <div class="card">
        <div class="asm-ok-bar">${passIcon} COMPILED SUCCESSFULLY — ${lump.methods.length} method${lump.methods.length!==1?'s':''}, ${lump.cw} code word${lump.cw!==1?'s':''}, ${lump.cc} c-list slot${lump.cc!==1?'s':''} · ready for SAVE LUMP</div>
        <h3>Compilation Listing</h3>
        <div class="asm-listing">${listing.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      </div>
      <div class="card">
        <h3>Compilation Stats</h3>
        <div class="kv-grid">
          <div class="kv-key">Total size</div>    <div class="kv-val">${lump.lump_size} words (2<sup>${n}</sup>) = ${lump.lump_size*4} bytes</div>
          <div class="kv-key">Code words</div>    <div class="kv-val">cw = ${lump.cw} (words 1..${lump.cw})</div>
          <div class="kv-key">Freespace</div>     <div class="kv-val">${freespace} words — Mint verifies all-zero</div>
          <div class="kv-key">C-list slots</div>  <div class="kv-val">cc = ${lump.cc}${lump.cc>0?' (words '+(lump.lump_size-lump.cc)+'...'+(lump.lump_size-1)+')':' — no c-list'}</div>
          <div class="kv-key">Methods</div>       <div class="kv-val">${lump.methods.length} (${lump.methods.filter(m=>!m.visibility||m.visibility==='public').length} public, ${lump.methods.filter(m=>m.visibility==='private').length} private)</div>
          <div class="kv-key">Language</div>      <div class="kv-val">${lump.language || '—'}</div>
          <div class="kv-key">NS slot</div>       <div class="kv-val">${lump.ns_slot !== null && lump.ns_slot !== undefined ? `NS[${lump.ns_slot}]` : 'dynamic / none'}</div>
          <div class="kv-key">Token</div>         <div class="kv-val"><code>${lump.token}</code></div>
        </div>
      </div>`;

  } else if (tab === 'docs') {
    const refs = lump.doc_refs || [];
    const countHtml = `<div class="doc-stat">
      <div class="doc-count-big">${lump.doc_count}</div>
      <div class="doc-count-label">documentation files reference<br><strong>${lump.id}</strong></div>
    </div>`;
    const listHtml = refs.length ? `<ul class="doc-list">${refs.map(d=>`<li><span class="doc-icon">📄</span><a class="doc-link" href="../${d}" target="_blank">${d}</a></li>`).join('')}</ul>` :
      `<p class="empty-note">No documentation cross-references recorded for this lump.</p>`;
    body.innerHTML = `<div class="card">
      <h3>Documentation Cross-References</h3>
      ${countHtml}
      ${listHtml}
      ${lump.doc_count > refs.length ? `<p style="font-size:0.78rem;color:#aaa;margin-top:0.5rem;">Showing ${refs.length} of ${lump.doc_count} referencing files.</p>` : ''}
    </div>
    <div class="card">
      <h3>Specification Cross-References — Spec §Cross-references</h3>
      <ul class="doc-list">
        <li><span class="doc-icon">📄</span><a class="doc-link" href="../CM_LUMP_SPECIFICATION.md" target="_blank">CM_LUMP_SPECIFICATION.md</a> — §Lump Memory Layout, §Mint Validation Sequence, §NS Slot Assignment</li>
        <li><span class="doc-icon">📄</span><a class="doc-link" href="../architecture.md" target="_blank">architecture.md</a> — Overall Church Machine architecture</li>
        <li><span class="doc-icon">📄</span><a class="doc-link" href="../Lump-Architecture.md" target="_blank">Lump-Architecture.md</a> — Accessible overview of the Lump object model</li>
        <li><span class="doc-icon">📄</span><a class="doc-link" href="../golden-tokens.md" target="_blank">golden-tokens.md</a> — GT format, encoding, and capability rules</li>
        <li><span class="doc-icon">📄</span><a class="doc-link" href="../foundation-lump-design.md" target="_blank">foundation-lump-design.md</a> — Lump design rationale and layout rules</li>
      </ul>
    </div>`;
  }
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
renderList();
</script>
