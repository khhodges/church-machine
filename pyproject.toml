[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "amaranth==0.5.9",
    "bleach>=6.4.0",
    "click>=8.5.0",
    "cryptography>=50.0.1",
    "flask>=3.1.3",
    "flask-dance>=7.1.0",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.13.0",
    "idna>=3.19",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    "apscheduler>=3.11.2",
    "resend>=2.21.0",
    "fpdf2>=2.8.0",
    "pycryptodome>=3.23.0",
    "werkzeug>=3.1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: Live HTTP tests against the deployed API (requires network and CLOOMC_API_BASE env var)",
]
